<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>学習ログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">study log</p>
            <h1 id="app-title">学習ログ</h1>
          </div>
          <div class="save-state" id="save-state" aria-live="polite">未保存</div>
        </div>

        <form id="diary-form" class="diary-form">
          <label class="field-label" for="entry-date">日付</label>
          <input id="entry-date" name="date" type="date" required />

          <label class="field-label" for="entry-category">学習カテゴリ</label>
          <select id="entry-category" name="category" aria-label="学習カテゴリ">
            <option value="英語">英語</option>
            <option value="プログラミング">プログラミング</option>
            <option value="読書">読書</option>
          </select>

          <fieldset class="mood-field">
            <legend>集中度</legend>
            <div class="mood-grid" id="mood-grid">
              <label class="mood-option">
                <input type="radio" name="mood" value="happy" required />
                <span class="mood-face">✨</span>
                <span>絶好調</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="calm" />
                <span class="mood-face">🙂</span>
                <span>集中！</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="normal" />
                <span class="mood-face">😐</span>
                <span>ふつう</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="tired" />
                <span class="mood-face">😵</span>
                <span>微妙</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="sad" />
                <span class="mood-face">😓</span>
                <span>ないよりマシ</span>
              </label>
            </div>
          </fieldset>

          <label class="field-label" for="entry-note">今日の学習メモ</label>
          <textarea
            id="entry-note"
            name="note"
            rows="5"
            maxlength="160"
            placeholder="例: 英単語を20問覚えた、復習を中心に進めた"
          ></textarea>
          <div class="note-meta">
            <span id="editing-label">今日の記録を書いています</span>
            <span><span id="char-count">0</span>/160</span>
          </div>

          <div class="action-row">
            <button class="primary-button" type="submit">保存</button>
            <button class="ghost-button" type="button" id="clear-button">入力をクリア</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">study records</p>
            <h2 id="history-title">学習ログ</h2>
          </div>
          <div class="stats-strip" aria-label="記録数">
            <strong id="entry-count">0</strong>
            <span>回</span>
          </div>
        </div>

        <section class="biorhythm" aria-labelledby="biorhythm-title">
          <div>
            <p class="biorhythm-label" id="biorhythm-title">集中の変化</p>
            <strong id="biorhythm-message">記録を保存すると表示されます</strong>
          </div>
          <div class="rhythm-chart" id="rhythm-chart" aria-label="最近7件の集中の流れ"></div>
          <p id="biorhythm-detail" class="biorhythm-detail">最近7件の集中の変化を表示します。</p>
        </section>

        <div class="summary-row" id="summary-row" aria-label="集中度の集計"></div>
        <div class="category-panel" aria-label="カテゴリごとの記録数">
          <p class="biorhythm-label">カテゴリ別の記録</p>
          <div class="category-chart" id="category-chart"></div>
        </div>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span>検索</span>
            <input id="search-input" type="search" placeholder="学習メモから探す" />
          </label>
          <select id="mood-filter" aria-label="学習カテゴリで絞り込み">
            <option value="all">すべてのカテゴリ</option>
            <option value="英語">英語</option>
            <option value="プログラミング">プログラミング</option>
            <option value="読書">読書</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>まだ記録がありません</strong>
          <span>今日の学習内容とメモを保存すると、ここに表示されます。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="保存した日記一覧"></ul>
        <button id="load-more-button" class="load-more-button" type="button" hidden>続きを読み込む</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
